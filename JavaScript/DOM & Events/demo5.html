<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <script>
        function myFunction(){
            document.getElementById("demo").innerHTML="Amit kumar";
        }
        function hideFunction(){
            document.getElementById("demo").innerHTML="";
        }
    </script>
</head>
<body>
    <h1 id="demo"></h1>
    <button onclick="myFunction()">Click me</button>
    <button onclick="hideFunction()">Hide</button>
</body>
</html>
