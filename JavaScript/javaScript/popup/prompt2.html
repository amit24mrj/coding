<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age= prompt("Hello, this is a popup prompt dialog! please enter your age")
        if(age===null){
            alert("User clecked cancel")
        }
        else if(isNaN(age)||age<=0){
            alert("please enter a valid age")
        }
        else{
            alert("user entered: "+ age)
        }
    </script>
</body>
</html>
