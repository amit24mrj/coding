<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="greetUser()">Click Me</button>
    <script>
        function greetUser(){
            let name= prompt("What is your name?")
            if(name){
                alert("Hello, "+ name+"!")
            }
        }
    </script>
</body>
</html>
